spring:
  application:
    name: bank-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-accounts-internal-api
              uri: no://op
              predicates:
                - Path=/api/accounts/internal/**
              filters:
                - SetStatus=404
            - id: accounts-service
              uri: ${BANK_ACCOUNTS_BASE_URL:http://accounts-service:8081}
              predicates:
                - Path=/api/accounts/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: ${BANK_CASH_BASE_URL:http://cash-service:8082}
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: ${BANK_TRANSFER_BASE_URL:http://transfer-service:8083}
              predicates:
                - Path=/api/transfers
              filters:
                - JwtTokenRelay
            - id: exchange-service
              uri: ${BANK_EXCHANGE_BASE_URL:http://exchange-service:8086}
              predicates:
                - Path=/api/exchange/**
              filters:
                - JwtTokenRelay
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}

server:
  port: 8080
