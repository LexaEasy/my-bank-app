spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-accounts-internal-api
              uri: no://op
              predicates:
                - Path=/api/accounts/internal/**
              filters:
                - SetStatus=404
            - id: accounts-service
              uri: http://accounts-service:8081
              predicates:
                - Path=/api/accounts/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: http://cash-service:8082
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: http://transfer-service:8083
              predicates:
                - Path=/api/transfers
              filters:
                - JwtTokenRelay
            - id: exchange-service
              uri: http://exchange-service:8086
              predicates:
                - Path=/api/exchange/**
              filters:
                - JwtTokenRelay
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/bank-realm
          jwk-set-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs


