spring:
  application:
    name: cash-service
  jackson:
    default-property-inclusion: non_null
  kafka:
    admin:
      fail-fast: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[max.in.flight.requests.per.connection]": 5
    template:
      observation-enabled: true
  security:
    oauth2:
      client:
        registration:
          cash-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: cash-service
            client-secret: ${CASH_SERVICE_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/token}
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs}

bank:
  http-client:
    connect-timeout: ${BANK_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${BANK_HTTP_CLIENT_READ_TIMEOUT:5s}
    circuit-breaker:
      failure-threshold: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      open-duration: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_OPEN_DURATION:5s}
    retry:
      max-attempts: ${BANK_HTTP_CLIENT_RETRY_MAX_ATTEMPTS:2}
      backoff: ${BANK_HTTP_CLIENT_RETRY_BACKOFF:100ms}
  kafka:
    notifications-dlt-topic: ${BANK_KAFKA_NOTIFICATIONS_DLT_TOPIC:bank.notifications.dlt}
    notifications-dlt-partitions: ${BANK_KAFKA_NOTIFICATIONS_DLT_PARTITIONS:3}
    notifications-dlt-retention-ms: ${BANK_KAFKA_NOTIFICATIONS_DLT_RETENTION_MS:604800000}
    notifications-partitions: ${BANK_KAFKA_NOTIFICATIONS_PARTITIONS:3}
    notifications-replication-factor: ${BANK_KAFKA_NOTIFICATIONS_REPLICATION_FACTOR:1}
    notifications-topic: ${BANK_KAFKA_NOTIFICATIONS_TOPIC:bank.notifications}
  services:
    accounts:
      base-url: ${BANK_ACCOUNTS_BASE_URL:http://accounts-service:8081}
    blocker:
      base-url: ${BANK_BLOCKER_BASE_URL:http://blocker-service:8088}
    exchange:
      base-url: ${BANK_EXCHANGE_BASE_URL:http://exchange-service:8086}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8092}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}

server:
  port: 8082
