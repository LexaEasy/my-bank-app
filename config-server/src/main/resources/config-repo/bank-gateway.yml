spring:
  application:
    name: bank-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: block-accounts-internal-api
              uri: no://op
              predicates:
                - Path=/api/accounts/internal/**
              filters:
                - SetStatus=404
            - id: accounts-service
              uri: lb://accounts-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - JwtTokenRelay
            - id: cash-service
              uri: lb://cash-service
              predicates:
                - Path=/api/cash/**
              filters:
                - JwtTokenRelay
            - id: transfer-service
              uri: lb://transfer-service
              predicates:
                - Path=/api/transfers
              filters:
                - JwtTokenRelay
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BANK_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank-realm}
          jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs}

server:
  port: 8080
