spring:
  application:
    name: exchange-generator
  security:
    oauth2:
      client:
        registration:
          exchange-generator:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: exchange-generator
            client-secret: ${EXCHANGE_GENERATOR_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/token}

bank:
  services:
    exchange:
      base-url: ${BANK_EXCHANGE_BASE_URL:http://exchange-service}
  exchange-generator:
    fixed-delay-ms: ${BANK_EXCHANGE_GENERATOR_FIXED_DELAY_MS:1000}

server:
  port: 8087
