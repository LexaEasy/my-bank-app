spring:
  application:
    name: discovery-server
  jackson:
    default-property-inclusion: non_null

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8761
