x-app-health: &app-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-platform-health: &platform-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-service-env: &service-env
  BANK_EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/

x-resource-server-env: &resource-server-env
  BANK_KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/bank-realm
  BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bank
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [bank-network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-__KEYCLOAK_ADMIN_USERNAME__}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-__KEYCLOAK_ADMIN_PASSWORD__}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
    ports:
      - "8180:8080"
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
    volumes:
      - ./keycloak/realms/bank-realm.json:/opt/keycloak/data/import/bank-realm-realm.json:ro
    networks: [bank-network]

  discovery-server:
    build:
      context: ./discovery-server
    image: my-bank-discovery-server:local
    environment:
      <<: *service-env
    ports:
      - "8761:8761"
    healthcheck:
      <<: *platform-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8761'"]
    networks: [bank-network]

  accounts-service:
    build:
      context: ./accounts-service
    image: my-bank-accounts-service:local
    environment:
      <<: [*service-env, *resource-server-env]
      BANK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank
      BANK_DATASOURCE_USERNAME: postgres
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8081'"]
    networks: [bank-network]

  notifications-service:
    build:
      context: ./notifications-service
    image: my-bank-notifications-service:local
    environment:
      <<: [*service-env, *resource-server-env]
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8084'"]
    networks: [bank-network]

  exchange-service:
    build:
      context: ./exchange-service
    image: my-bank-exchange-service:local
    environment:
      <<: [*service-env, *resource-server-env]
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8086'"]
    networks: [bank-network]

  blocker-service:
    build:
      context: ./blocker-service
    image: my-bank-blocker-service:local
    environment:
      <<: [*service-env, *resource-server-env]
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8088'"]
    networks: [bank-network]

  exchange-generator:
    build:
      context: ./exchange-generator
    image: my-bank-exchange-generator:local
    environment:
      <<: *service-env
      EXCHANGE_GENERATOR_CLIENT_SECRET: ${EXCHANGE_GENERATOR_CLIENT_SECRET:-__EXCHANGE_GENERATOR_CLIENT_SECRET__}
      BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
    depends_on:
      exchange-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8087'"]
    networks: [bank-network]

  cash-service:
    build:
      context: ./cash-service
    image: my-bank-cash-service:local
    environment:
      <<: [*service-env, *resource-server-env]
      CASH_SERVICE_CLIENT_SECRET: ${CASH_SERVICE_CLIENT_SECRET:-__CASH_SERVICE_CLIENT_SECRET__}
      BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
    depends_on:
      accounts-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8082'"]
    networks: [bank-network]

  transfer-service:
    build:
      context: ./transfer-service
    image: my-bank-transfer-service:local
    environment:
      <<: [*service-env, *resource-server-env]
      TRANSFER_SERVICE_CLIENT_SECRET: ${TRANSFER_SERVICE_CLIENT_SECRET:-__TRANSFER_SERVICE_CLIENT_SECRET__}
      BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
    depends_on:
      accounts-service:
        condition: service_healthy
      blocker-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8083'"]
    networks: [bank-network]

  bank-gateway:
    build:
      context: ./bank-gateway
    image: my-bank-gateway:local
    environment:
      <<: [*service-env, *resource-server-env]
    ports:
      - "8080:8080"
    depends_on:
      accounts-service:
        condition: service_healthy
      cash-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
    networks: [bank-network]

  front-ui:
    build:
      context: ./front-ui
    image: my-bank-front-ui:local
    environment:
      <<: *service-env
      FRONT_UI_CLIENT_SECRET: ${FRONT_UI_CLIENT_SECRET:-__FRONT_UI_CLIENT_SECRET__}
      BANK_KEYCLOAK_AUTHORIZATION_URI: http://localhost:8180/realms/bank-realm/protocol/openid-connect/auth
      BANK_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
      BANK_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs
      BANK_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/userinfo
      BANK_KEYCLOAK_END_SESSION_URI: http://localhost:8180/realms/bank-realm/protocol/openid-connect/logout
      BANK_GATEWAY_URL: http://bank-gateway:8080
    ports:
      - "8085:8085"
    depends_on:
      bank-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8085'"]
    networks: [bank-network]

volumes:
  postgres-data:

networks:
  bank-network:
