services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bank
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8180:8080"

  config-server:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: ["sh", "./gradlew", "--no-daemon", ":config-server:bootRun"]
    environment:
      GRADLE_USER_HOME: /workspace/.gradle-cache
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace

  discovery-server:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: ["sh", "./gradlew", "--no-daemon", ":discovery-server:bootRun"]
    environment:
      GRADLE_USER_HOME: /workspace/.gradle-cache
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    volumes:
      - .:/workspace

volumes:
  postgres-data:
