spring:
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          exchange-generator:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: exchange-generator
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/bank-realm/protocol/openid-connect/token

eureka:
  client:
    enabled: false

bank:
  services:
    exchange:
      base-url: http://exchange-service
  exchange-generator:
    fixed-delay-ms: 1000
