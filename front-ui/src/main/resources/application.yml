spring:
  application:
    name: front-ui
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          front-ui:
            provider: keycloak
            client-id: front-ui
            client-secret: ${FRONT_UI_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: ${BANK_KEYCLOAK_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${BANK_KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/auth}
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/token}
            jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs}
            user-info-uri: ${BANK_KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

bank:
  http-client:
    connect-timeout: ${BANK_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${BANK_HTTP_CLIENT_READ_TIMEOUT:5s}
    circuit-breaker:
      failure-threshold: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      open-duration: ${BANK_HTTP_CLIENT_CIRCUIT_BREAKER_OPEN_DURATION:5s}
    retry:
      max-attempts: ${BANK_HTTP_CLIENT_RETRY_MAX_ATTEMPTS:2}
      backoff: ${BANK_HTTP_CLIENT_RETRY_BACKOFF:100ms}
  services:
    accounts:
      base-url: ${BANK_ACCOUNTS_BASE_URL:http://accounts-service:8081}
    cash:
      base-url: ${BANK_CASH_BASE_URL:http://cash-service:8082}
    transfer:
      base-url: ${BANK_TRANSFER_BASE_URL:http://transfer-service:8083}
    exchange:
      base-url: ${BANK_EXCHANGE_BASE_URL:http://exchange-service:8086}
  security:
    logout:
      end-session-uri: ${BANK_KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/logout}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8095}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}

server:
  port: 8085
  tomcat:
    use-relative-redirects: true
