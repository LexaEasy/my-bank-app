spring:
  application:
    name: front-ui
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          front-ui:
            provider: keycloak
            client-id: front-ui
            client-secret: ${FRONT_UI_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: ${BANK_KEYCLOAK_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${BANK_KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/auth}
            token-uri: ${BANK_KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/token}
            jwk-set-uri: ${BANK_KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs}
            user-info-uri: ${BANK_KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

bank:
  services:
    accounts:
      base-url: ${BANK_ACCOUNTS_BASE_URL:http://accounts-service:8081}
    cash:
      base-url: ${BANK_CASH_BASE_URL:http://cash-service:8082}
    transfer:
      base-url: ${BANK_TRANSFER_BASE_URL:http://transfer-service:8083}
    exchange:
      base-url: ${BANK_EXCHANGE_BASE_URL:http://exchange-service:8086}
  security:
    logout:
      end-session-uri: ${BANK_KEYCLOAK_END_SESSION_URI:http://localhost:8180/realms/bank-realm/protocol/openid-connect/logout}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8085
  tomcat:
    use-relative-redirects: true
