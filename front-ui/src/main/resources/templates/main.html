<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bank</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <header class="topbar">
        <div>
            <p class="eyebrow">My Bank</p>
            <h1>Банк</h1>
        </div>
        <div class="user">
            <span th:text="${username}">user</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="secondary">Выйти</button>
            </form>
        </div>
    </header>

    <div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="layout">
        <article class="panel">
            <h2>Обо мне</h2>
            <form class="account-form" method="post" th:action="@{/account}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    Фамилия и имя
                    <input type="text" name="name" th:value="${accountName}" autocomplete="name" disabled>
                </label>
                <label>
                    Дата рождения
                    <input type="date" name="birthdate" th:value="${birthdate}" disabled>
                </label>
                <div class="balance">
                    <span>Баланс</span>
                    <strong>
                        <span th:text="${balance}">0.00</span>
                        <span th:text="${currency}">RUB</span>
                    </strong>
                </div>
                <button type="submit" disabled>Сохранить</button>
            </form>
        </article>

        <article class="panel">
            <h2>Операции с наличными</h2>
            <form class="cash-form" method="post" th:action="@{/cash}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    Сумма
                    <input type="number" name="amount" min="0.01" step="0.01" disabled>
                </label>
                <div class="actions">
                    <button type="submit" name="action" value="deposit" disabled>Положить</button>
                    <button type="submit" name="action" value="withdraw" disabled>Снять</button>
                </div>
            </form>
        </article>

        <article class="panel wide">
            <h2>Переводы</h2>
            <form class="transfer-form" th:action="@{/transfers}" th:object="${transferForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    Получатель
                    <input type="text" th:field="*{recipientLogin}" placeholder="petr" autocomplete="off">
                </label>
                <label>
                    Сумма
                    <input type="number" th:field="*{amount}" min="0.01" step="0.01">
                </label>
                <label>
                    Валюта
                    <select th:field="*{currency}">
                        <option value="RUB">RUB</option>
                    </select>
                </label>
                <button type="submit">Перевести</button>
            </form>

            <div class="result" th:if="${transferResponse}">
                <span>Получатель</span>
                <strong th:text="${transferResponse.recipientLogin()}">petr</strong>
                <span>Остаток</span>
                <strong>
                    <span th:text="${transferResponse.senderBalance()}">800.00</span>
                    <span th:text="${transferResponse.currency()}">RUB</span>
                </strong>
            </div>
        </article>
    </section>
</main>
</body>
</html>
