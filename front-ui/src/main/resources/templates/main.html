<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bank</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <header class="topbar">
        <div>
            <p class="eyebrow">My Bank</p>
            <h1>Банк</h1>
        </div>
        <div class="user">
            <span th:text="${username}">user</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="secondary">Выйти</button>
            </form>
        </div>
    </header>

    <div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="layout">
        <article class="panel">
            <h2>Обо мне</h2>
            <form class="account-form" method="post" th:action="@{/account}" th:object="${accountForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    Фамилия и имя
                    <input type="text" th:field="*{name}" autocomplete="name" minlength="2" maxlength="120">
                </label>
                <label>
                    Дата рождения
                    <input type="date" th:field="*{birthdate}">
                </label>
                <div class="balance">
                    <span>Баланс</span>
                    <strong>
                        <span th:text="${balance}">0.00</span>
                        <span th:text="${currency}">RUB</span>
                    </strong>
                </div>
                <p class="inline-error" th:if="${accountLoadError}" th:text="${accountLoadError}"></p>
                <button type="submit">Сохранить</button>
            </form>
        </article>

        <article class="panel">
            <h2>Операции с наличными</h2>
            <form class="cash-form" method="post" th:action="@{/cash}" th:object="${cashForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{idempotencyKey}">
                <label>
                    Сумма
                    <input type="number" th:field="*{amount}" min="0.01" step="0.01">
                </label>
                <input type="hidden" th:field="*{currency}">
                <div class="actions">
                    <button type="submit" name="action" value="deposit">Положить</button>
                    <button type="submit" name="action" value="withdraw">Снять</button>
                </div>
            </form>
        </article>

        <article class="panel wide">
            <h2>Курсы валют</h2>
            <p class="inline-error" th:if="${exchangeRatesLoadError}" th:text="${exchangeRatesLoadError}"></p>
            <div class="empty-state" th:if="${#lists.isEmpty(exchangeRates) and exchangeRatesLoadError == null}">
                Курсы валют пока не загружены
            </div>
            <div class="rates-table" th:if="${!#lists.isEmpty(exchangeRates)}">
                <div class="rates-row rates-head">
                    <span>Валюта</span>
                    <span>Покупка</span>
                    <span>Продажа</span>
                </div>
                <div class="rates-row" th:each="rate : ${exchangeRates}">
                    <strong th:text="${rate.currency()}">USD</strong>
                    <span th:text="${rate.buyRate()}">90.0000</span>
                    <span th:text="${rate.sellRate()}">92.0000</span>
                </div>
            </div>
        </article>

        <article class="panel wide">
            <h2>Переводы</h2>
            <form class="transfer-form" th:action="@{/transfers}" th:object="${transferForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{sourceCurrency}">
                <input type="hidden" th:field="*{idempotencyKey}">
                <label>
                    Получатель
                    <select th:field="*{recipientLogin}">
                        <option value="">Выберите получателя</option>
                        <option th:each="recipient : ${recipients}"
                                th:value="${recipient.login()}"
                                th:text="${recipient.name() + ' (' + recipient.login() + ')'}">
                            Петр
                        </option>
                    </select>
                </label>
                <label>
                    Сумма
                    <input type="number" th:field="*{amount}" min="0.01" step="0.01">
                </label>
                <label>
                    Валюта
                    <select th:field="*{currency}">
                        <option value="RUB">RUB</option>
                        <option value="USD">USD</option>
                        <option value="CNY">CNY</option>
                    </select>
                </label>
                <button type="submit">Перевести</button>
            </form>
            <p class="inline-error" th:if="${recipientsLoadError}" th:text="${recipientsLoadError}"></p>

            <div class="result" th:if="${transferResponse}">
                <span>Получатель</span>
                <strong th:text="${transferResponse.recipientLogin()}">petr</strong>
                <span>Остаток</span>
                <strong>
                    <span th:text="${transferResponse.senderBalance()}">800.00</span>
                    <span th:text="${transferResponse.currency()}">RUB</span>
                </strong>
            </div>
        </article>
    </section>
</main>
</body>
</html>
