{{- range $path, $_ := .Files.Glob "files/grafana-dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "grafana-%s" (base $path | trimSuffix ".json") | trunc 63 | trimSuffix "-" }}
  labels:
    grafana_dashboard: "1"
    {{- include "bank.labels" $ | nindent 4 }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
