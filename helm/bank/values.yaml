global:
  namespace: bank
  imageRegistry: ""
  imageTag: local
  keycloakUrl: http://keycloak:8080/realms/bank-realm
  postgresql:
    host: postgresql
    port: 5432
    database: bank
    username: postgres
  env:
    SPRING_JACKSON_DEFAULTPROPERTYINCLUSION: non_null
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWKSETURI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKENURI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://keycloak:8080/realms/bank-realm
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs

gatewayApi:
  enabled: true
  gatewayClassName: nginx
  listener:
    name: http
    port: 80
    hostname: ""

front-ui:
  enabled: true
  fullnameOverride: front-ui
  env:
    BANK_SERVICES_ACCOUNTS_BASEURL: http://accounts-service:8081
    BANK_SERVICES_CASH_BASEURL: http://cash-service:8082
    BANK_SERVICES_EXCHANGE_BASEURL: http://exchange-service:8086
    BANK_SERVICES_TRANSFER_BASEURL: http://transfer-service:8083
    BANK_SECURITY_LOGOUT_ENDSESSIONURI: http://localhost:8180/realms/bank-realm/protocol/openid-connect/logout
    SERVER_PORT: "8085"
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATIONURI: http://localhost:8180/realms/bank-realm/protocol/openid-connect/auth
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USERINFOURI: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/userinfo
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USERNAMEATTRIBUTE: preferred_username
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_AUTHORIZATIONGRANTTYPE: authorization_code
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_CLIENTID: front-ui
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_PROVIDER: keycloak
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_REDIRECTURI: "{baseUrl}/login/oauth2/code/{registrationId}"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_SCOPE: openid,profile,email
  secretEnv:
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FRONTUI_CLIENTSECRET
      secretName: bank-service-credentials
      key: FRONT_UI_CLIENT_SECRET

accounts-service:
  enabled: true
  fullnameOverride: accounts-service
  env:
    SERVER_PORT: "8081"
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/bank
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_JPA_HIBERNATE_DDLAUTO: validate
    SPRING_JPA_OPENINVIEW: "false"
  secretEnv:
    - name: SPRING_DATASOURCE_PASSWORD
      secretName: postgresql-credentials
      key: password

cash-service:
  enabled: true
  fullnameOverride: cash-service
  env:
    BANK_SERVICES_ACCOUNTS_BASEURL: http://accounts-service:8081
    BANK_SERVICES_BLOCKER_BASEURL: http://blocker-service:8088
    BANK_SERVICES_NOTIFICATIONS_BASEURL: http://notifications-service:8084
    SERVER_PORT: "8082"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASHSERVICE_AUTHORIZATIONGRANTTYPE: client_credentials
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASHSERVICE_CLIENTID: cash-service
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASHSERVICE_PROVIDER: keycloak
  secretEnv:
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CASHSERVICE_CLIENTSECRET
      secretName: bank-service-credentials
      key: CASH_SERVICE_CLIENT_SECRET

transfer-service:
  enabled: true
  fullnameOverride: transfer-service
  env:
    BANK_SERVICES_ACCOUNTS_BASEURL: http://accounts-service:8081
    BANK_SERVICES_BLOCKER_BASEURL: http://blocker-service:8088
    BANK_SERVICES_EXCHANGE_BASEURL: http://exchange-service:8086
    BANK_SERVICES_NOTIFICATIONS_BASEURL: http://notifications-service:8084
    SERVER_PORT: "8083"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TRANSFERSERVICE_AUTHORIZATIONGRANTTYPE: client_credentials
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TRANSFERSERVICE_CLIENTID: transfer-service
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TRANSFERSERVICE_PROVIDER: keycloak
  secretEnv:
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TRANSFERSERVICE_CLIENTSECRET
      secretName: bank-service-credentials
      key: TRANSFER_SERVICE_CLIENT_SECRET

exchange-service:
  enabled: true
  fullnameOverride: exchange-service
  env:
    SERVER_PORT: "8086"

exchange-generator:
  enabled: true
  fullnameOverride: exchange-generator
  env:
    BANK_EXCHANGEGENERATOR_FIXEDDELAYMS: "1000"
    BANK_SERVICES_EXCHANGE_BASEURL: http://exchange-service:8086
    SERVER_PORT: "8087"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_EXCHANGEGENERATOR_AUTHORIZATIONGRANTTYPE: client_credentials
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_EXCHANGEGENERATOR_CLIENTID: exchange-generator
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_EXCHANGEGENERATOR_PROVIDER: keycloak
  secretEnv:
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_EXCHANGEGENERATOR_CLIENTSECRET
      secretName: bank-service-credentials
      key: EXCHANGE_GENERATOR_CLIENT_SECRET

blocker-service:
  enabled: true
  fullnameOverride: blocker-service
  env:
    BANK_BLOCKER_MAXAMOUNT: "100000.00"
    SERVER_PORT: "8088"

notifications-service:
  enabled: true
  fullnameOverride: notifications-service
  env:
    SERVER_PORT: "8084"

bank-gateway:
  enabled: false
  fullnameOverride: bank-gateway
  env:
    SERVER_PORT: "8080"
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: SetStatus=404
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: block-accounts-internal-api
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/accounts/internal/**
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: no://op
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: JwtTokenRelay
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: accounts-service
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/api/accounts/**
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://accounts-service:8081
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: JwtTokenRelay
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: cash-service
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/api/cash/**
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://cash-service:8082
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: JwtTokenRelay
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: transfer-service
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/api/transfers
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://transfer-service:8083
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_FILTERS_0: JwtTokenRelay
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: exchange-service
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/api/exchange/**
    SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://exchange-service:8086

postgresql:
  enabled: true
  fullnameOverride: postgresql

keycloak:
  enabled: true
  fullnameOverride: keycloak
