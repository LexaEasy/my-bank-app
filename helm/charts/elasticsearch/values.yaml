nameOverride: ""
fullnameOverride: elasticsearch

environment: dev

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: "9.4.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9200

config:
  securityEnabled: false
  javaOpts: -Xms512m -Xmx512m

persistence:
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
