{{- $test := .Values.test | default dict -}}
{{- if ($test.enabled | default true) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include (printf "%s.fullname" .Chart.Name) . }}-smoke-test
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include (printf "%s.labels" .Chart.Name) . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: "{{ $test.imageRepository | default "curlimages/curl" }}:{{ $test.imageTag | default "8.21.0" }}"
          imagePullPolicy: {{ $test.imagePullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -ec
            - |
              code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 http://{{ include (printf "%s.fullname" .Chart.Name) . }}:{{ .Values.service.port }}/)"
              test "$code" != "000"
{{- end }}
