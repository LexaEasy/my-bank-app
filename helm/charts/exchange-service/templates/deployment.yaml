{{- $global := default dict .Values.global -}}
{{- $registry := default "" (get $global "imageRegistry") -}}
{{- $tag := default .Values.image.tag (get $global "imageTag") -}}
{{- $repository := .Values.image.repository -}}
{{- if $registry -}}
{{- $repository = printf "%s/%s" (trimSuffix "/" $registry) $repository -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include (printf "%s.fullname" .Chart.Name) . }}
  labels:
    {{- include (printf "%s.labels" .Chart.Name) . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include (printf "%s.name" .Chart.Name) . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include (printf "%s.labels" .Chart.Name) . | nindent 8 }}
    spec:
      serviceAccountName: {{ include (printf "%s.fullname" .Chart.Name) . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ $repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
