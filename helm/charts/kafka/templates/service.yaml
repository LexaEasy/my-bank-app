{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: {{ .Values.service.brokerPort }}
      targetPort: broker
      protocol: TCP
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
{{- end }}
