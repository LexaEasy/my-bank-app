replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.6.3
  pullPolicy: IfNotPresent

service:
  port: 8080

admin:
  existingSecret: keycloak-credentials
  usernameKey: admin-username
  passwordKey: admin-password

realmImport:
  enabled: true
  existingSecret: keycloak-realm
  key: bank-realm.json

resources: {}
