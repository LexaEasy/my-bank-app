apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kibana.fullname" . }}
  labels:
    {{- include "kibana.labels" . | nindent 4 }}
data:
  kibana.yml: |
    server.host: 0.0.0.0
    server.port: {{ .Values.service.port }}
    elasticsearch.hosts:
      - {{ .Values.config.elasticsearchUrl }}
