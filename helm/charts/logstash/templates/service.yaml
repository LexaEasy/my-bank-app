apiVersion: v1
kind: Service
metadata:
  name: {{ include "logstash.fullname" . }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "logstash.selectorLabels" . | nindent 4 }}
  ports:
    - name: logs
      port: {{ .Values.service.tcpPort }}
      targetPort: logs
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
