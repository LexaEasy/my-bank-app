apiVersion: v1
kind: Pod
metadata:
  name: {{ include "logstash.fullname" . }}-health-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.test.image }}
      command: [sh, -ec]
      args:
        - curl --fail --silent --show-error http://{{ include "logstash.fullname" . }}:{{ .Values.service.apiPort }}/_node/pipelines/bank-logs
