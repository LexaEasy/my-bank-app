apiVersion: v1
kind: Pod
metadata:
  name: {{ include "logstash.fullname" . }}-pipeline-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: pipeline
      image: {{ .Values.test.image }}
      command: [sh, -ec]
      args:
        - |
          payload='{"message":"helm-pipeline-test","password":"secret","accountNumber":"123456"}'
          printf '%s\n' "${payload}" | curl --silent --show-error --max-time 2 --upload-file - telnet://{{ include "logstash.fullname" . }}:{{ .Values.service.tcpPort }} || test $? -eq 28
          sleep 3
          response="$(curl --fail --silent --show-error '{{ .Values.config.elasticsearchUrl }}/bank-logs-*/_search?q=message:helm-pipeline-test')"
          echo "${response}" | grep -q '"environment":"dev"'
          echo "${response}" | grep -q '"accountNumber":"***"'
          if echo "${response}" | grep -q '"password"'; then exit 1; fi
