replicaCount: 1

image:
  repository: postgres
  tag: "18"
  pullPolicy: IfNotPresent

service:
  port: 5432

auth:
  database: bank
  username: postgres
  existingSecret: postgresql-credentials
  passwordKey: password

persistence:
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""

resources: {}

probes:
  startup:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
