{{- if and .Values.test.enabled .Values.management.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spring-service.fullname" . }}-smoke-test
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "spring-service.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: "{{ .Values.test.imageRepository }}:{{ .Values.test.imageTag }}"
          imagePullPolicy: {{ .Values.test.imagePullPolicy }}
          command:
            - sh
            - -ec
            - |
              url="http://{{ include "spring-service.fullname" . }}-management:{{ .Values.management.port }}{{ .Values.probes.readiness.path }}"
              actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "$url")"
              test "$actual" = "200"
{{- end }}
