fullnameOverride: bank-gateway

image:
  repository: my-bank-gateway

service:
  port: 8080

management:
  enabled: true
  port: 8090

probes:
  port: management

env:
  MANAGEMENT_SERVER_PORT: "8090"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: W3C
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"
