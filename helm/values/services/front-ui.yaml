fullnameOverride: front-ui

image:
  repository: my-bank-front-ui

service:
  port: 8085

management:
  enabled: true
  port: 8095

probes:
  port: management

env:
  MANAGEMENT_SERVER_PORT: "8095"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: W3C
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"
