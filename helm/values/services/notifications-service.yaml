fullnameOverride: notifications-service

image:
  repository: my-bank-notifications-service

service:
  enabled: false

management:
  enabled: true
  port: 8089

probes:
  port: management

env:
  MANAGEMENT_SERVER_PORT: "8089"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: W3C
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"

test:
  enabled: false
