fullnameOverride: transfer-service

image:
  repository: my-bank-transfer-service

service:
  port: 8083

management:
  enabled: true
  port: 8093

probes:
  port: management

env:
  BANK_LOGGING_LOGSTASH_DESTINATION: logstash:5000
  MANAGEMENT_SERVER_PORT: "8093"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: W3C
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"
