spring:
  application:
    name: notifications-service
  main:
    web-application-type: ${SPRING_MAIN_WEB_APPLICATION_TYPE:servlet}
  jackson:
    default-property-inclusion: non_null
  kafka:
    admin:
      fail-fast: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:bank-notifications}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: ru.practicum.bank.common.notification.NotificationEvent
        spring.json.trusted.packages: ru.practicum.bank.common.notification
    listener:
      ack-mode: record
      observation-enabled: true
bank:
  kafka:
    notifications-topic: ${BANK_KAFKA_NOTIFICATIONS_TOPIC:bank.notifications}
    notifications-dlt-topic: ${BANK_KAFKA_NOTIFICATIONS_DLT_TOPIC:bank.notifications.dlt}
    notifications-partitions: ${BANK_KAFKA_NOTIFICATIONS_PARTITIONS:3}
    notifications-dlt-partitions: ${BANK_KAFKA_NOTIFICATIONS_DLT_PARTITIONS:3}
    notifications-replication-factor: ${BANK_KAFKA_NOTIFICATIONS_REPLICATION_FACTOR:1}
    notifications-dlt-retention-ms: ${BANK_KAFKA_NOTIFICATIONS_DLT_RETENTION_MS:604800000}
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8089}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      namespace: ${MANAGEMENT_METRICS_TAGS_NAMESPACE:dev}
  tracing:
    propagation:
      type: ${MANAGEMENT_TRACING_PROPAGATION_TYPE:W3C}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED:true}
server:
  port: ${SERVER_PORT:8089}
