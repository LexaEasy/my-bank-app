spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[max.in.flight.requests.per.connection]": 5
  security:
    oauth2:
      client:
        registration:
          transfer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: transfer-service
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/bank-realm
          jwk-set-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs

bank:
  kafka:
    notifications-topic: bank.notifications
  services:
    accounts:
      base-url: http://accounts-service:8081
    notifications:
      base-url: http://notifications-service:8084
    blocker:
      base-url: http://blocker-service:8088
    exchange:
      base-url: http://exchange-service:8086

