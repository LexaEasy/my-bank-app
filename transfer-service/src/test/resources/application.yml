spring:
  security:
    oauth2:
      client:
        registration:
          transfer-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: transfer-service
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/bank-realm/protocol/openid-connect/token
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/bank-realm
          jwk-set-uri: http://localhost:8180/realms/bank-realm/protocol/openid-connect/certs

bank:
  services:
    accounts:
      base-url: http://accounts-service:8081
    notifications:
      base-url: http://notifications-service:8084
    blocker:
      base-url: http://blocker-service:8088
    exchange:
      base-url: http://exchange-service:8086
